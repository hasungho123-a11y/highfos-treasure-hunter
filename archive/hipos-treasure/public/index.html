<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하이포스 트레저 헌터</title>
<meta name="theme-color" content="#0B2340">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 밤바다 위에 펼친 보물 지도: 화면은 하나의 바다, 콘텐츠는 양피지 카드 */
:root {
  --sea: #0B2340; --sea-2: #123A5C; --foam: #CFE6F2; --parch: #F1DFB6; --parch-2: #E4C98F; --ink: #3B2A17; --ink-soft: #7A6040;
  --gold: #F4B63F; --gold-deep: #B9811A; --x: #D9483B; --teal: #2BA59B; --eng: #1F8A7A; --math: #C8503A; --gen: #6B5A3E;
  --display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif; --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; min-height: 100% }
body { background: radial-gradient(120% 60% at 50% 0%, var(--sea-2), var(--sea) 70%) fixed, var(--sea); color: var(--foam); font: 16px/1.5 var(--body);
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) }
button, input { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.2 }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.num { font-variant-numeric: tabular-nums }
[hidden] { display: none !important }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }

.parch { background: var(--parch); color: var(--ink); border-radius: 18px; box-shadow: 0 2px 0 var(--parch-2), 0 12px 30px rgb(0 0 0 / .35); padding: 18px }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; font-family: var(--display); font-size: 1.1rem; cursor: pointer; background: var(--gold); color: #3A2400; box-shadow: 0 4px 0 var(--gold-deep); transition: transform .08s }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep) }
.btn:disabled { background: #C9B88F; box-shadow: 0 4px 0 #A8976E; color: #6E5E3E; cursor: not-allowed }
.btn.line { background: transparent; box-shadow: inset 0 0 0 2px var(--ink-soft); color: var(--ink) }
.btn.sm { padding: 7px 12px; font-size: .95rem }
.err { color: var(--x); font-weight: 700; min-height: 1.5em; margin: 0 }

/* ---- 로그인 ---- */
.login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px }
.logo { text-align: center; margin-bottom: 18px }
.logo .k { font-size: 3.4rem; display: block; animation: bob 3s ease-in-out infinite }
.logo h1 { font-size: 2.2rem; color: var(--gold); text-shadow: 0 3px 0 #5A3A00 }
.logo p { margin: 4px 0 0; color: var(--foam); opacity: .8 }
.field { display: grid; gap: 6px; margin-bottom: 12px }
.field label { font-weight: 700; font-size: .9rem; color: var(--ink-soft) }
.field input { border: 2px solid var(--parch-2); background: #FBF2DC; border-radius: 12px; padding: 12px 14px; font-size: 1.1rem; color: var(--ink); width: 100% }
.pin { display: flex; gap: 10px; justify-content: center; margin: 6px 0 12px }
.pin span { width: 44px; height: 52px; border-radius: 12px; background: #FBF2DC; border: 2px solid var(--parch-2); display: grid; place-items: center; font-size: 1.6rem; color: var(--ink) }
.pin span.on { border-color: var(--gold-deep) }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.pad button { border: 0; background: #FBF2DC; border-radius: 12px; padding: 12px 0; font-family: var(--display); font-size: 1.4rem; color: var(--ink); box-shadow: 0 3px 0 var(--parch-2); cursor: pointer }
.pad button:active { transform: translateY(2px); box-shadow: none }

/* ---- 게임 화면 ---- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgb(11 35 64 / .92); backdrop-filter: blur(6px); border-bottom: 1px solid rgb(255 255 255 / .08) }
.hud .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px }
.ava { width: 44px; height: 44px; border-radius: 50%; background: var(--parch); display: grid; place-items: center; font-size: 1.5rem; flex: none; border: 0; cursor: pointer }
.who { min-width: 0; flex: 1 }
.who b { font-family: var(--display); font-size: 1.15rem; font-weight: 400; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.who small { opacity: .7; font-size: .8rem }
.stat { display: flex; align-items: center; gap: 4px; background: rgb(255 255 255 / .08); border-radius: 999px; padding: 4px 10px 4px 6px; font-family: var(--display); font-size: 1.1rem }
.coin { display: inline-block; width: 1.1em; height: 1.1em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE59A, var(--gold) 55%, var(--gold-deep)); box-shadow: inset 0 0 0 2px rgb(120 70 0 / .25) }
main { padding-block: 16px 110px; display: grid; gap: 16px }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--sea); border-top: 1px solid rgb(255 255 255 / .1); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr) }
.tabs button { border: 0; background: none; padding: 8px 0 10px; display: grid; gap: 2px; justify-items: center; font-family: var(--display); font-size: .9rem; color: rgb(207 230 242 / .6); cursor: pointer; position: relative }
.tabs button i { font-style: normal; font-size: 1.5rem }
.tabs button[aria-current="true"] { color: var(--gold) }
.tabs .dot { position: absolute; top: 6px; right: calc(50% - 22px); background: var(--x); color: #fff; font: 700 .7rem var(--body); border-radius: 999px; padding: 1px 6px }

.banner { display: flex; gap: 12px; align-items: center; background: linear-gradient(90deg, var(--gold), #FFD87A); color: #3A2400; border-radius: 16px; padding: 12px 16px; font-weight: 700 }
.banner .big { font-size: 2rem; animation: wiggle 1.4s ease-in-out infinite }
.next { display: grid; gap: 8px }
.bar { height: 14px; border-radius: 7px; background: var(--parch-2); overflow: hidden }
.bar i { display: block; height: 100%; background: repeating-linear-gradient(45deg, var(--teal) 0 10px, #35BDB2 10px 20px); border-radius: 7px; transition: width .6s }

.mapbox { padding: 6px; overflow: hidden }
.mapbox svg { display: block; width: 100%; height: auto }
.mapbox .stop-num { font-family: var(--display); font-size: 13px; fill: var(--ink) }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.sec-h h2 { font-size: 1.5rem; color: var(--gold) }
.sec-h small { opacity: .75 }
.list { display: grid; gap: 10px }
.card { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px }
.card .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem; background: #FBF2DC }
.card .t { font-weight: 700; line-height: 1.35 }
.card .m { font-size: .85rem; color: var(--ink-soft); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px }
.subj { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; color: #fff }
.s-영어 { background: var(--eng) } .s-수학 { background: var(--math) } .s-공통 { background: var(--gen) }
.st-done { color: var(--teal); font-family: var(--display); font-size: 1.05rem; white-space: nowrap }
.st-wait { display: grid; justify-items: end; gap: 2px; font-size: .8rem; color: var(--ink-soft); white-space: nowrap }
.st-wait button { border: 0; background: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: .8rem; padding: 0 }

.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 0; border-radius: 999px; padding: 6px 14px; background: rgb(255 255 255 / .1); cursor: pointer; font-weight: 700 }
.chip[aria-pressed="true"] { background: var(--gold); color: #3A2400 }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.badge { text-align: center; padding: 14px 10px; border-radius: 14px; background: #FBF2DC; display: grid; gap: 4px }
.badge .i { font-size: 2rem }
.badge.off { opacity: .45; filter: grayscale(1) }
.badge b { font-family: var(--display); font-weight: 400 }
.badge small { color: var(--ink-soft); font-size: .75rem }
.crew { display: flex; flex-wrap: wrap; gap: 8px }
.crew span { background: #FBF2DC; border-radius: 999px; padding: 4px 10px 4px 6px; font-size: .9rem }
.logrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--parch-2); font-size: .92rem }
.logrow:first-child { border-top: 0 }
.plus { font-weight: 700; color: var(--teal) } .minus { font-weight: 700; color: var(--x) }
.avatars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px }
.avatars button { border: 2px solid transparent; background: #FBF2DC; border-radius: 12px; font-size: 1.6rem; padding: 6px 0; cursor: pointer }
.avatars button[aria-pressed="true"] { border-color: var(--gold-deep) }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9; background: var(--parch); color: var(--ink); font-family: var(--display); font-size: 1.15rem;
  padding: 12px 20px; border-radius: 16px; box-shadow: 0 8px 30px rgb(0 0 0 / .4); max-width: calc(100% - 32px); text-align: center }
.celebrate { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden }
.celebrate i { position: absolute; top: -40px; font-style: normal; font-size: 1.8rem; animation: fall 1.8s ease-in forwards }

.chest-modal { position: fixed; inset: 0; z-index: 12; background: rgb(5 15 30 / .78); display: grid; place-items: center; padding: 16px }
.chest-box { background: var(--parch); color: var(--ink); border-radius: 22px; padding: 28px 22px; text-align: center; width: min(360px, 100%); display: grid; gap: 10px; justify-items: center; box-shadow: 0 20px 60px rgb(0 0 0 / .5) }
.chest-ic { font-size: 5rem; line-height: 1 }
.chest-ic.shake { animation: shake .5s ease-in-out infinite }
.chest-ic.pop { animation: reveal .5s ease-out }
.chest-box h2 { font-size: 1.6rem }
.chest-box p { margin: 0; color: var(--ink-soft) }
.rar { font: 700 .8rem var(--body); padding: 2px 10px; border-radius: 999px; background: #FBF2DC; color: var(--ink-soft) }
.rar.희귀 { background: #6A3FA0; color: #fff } .rar.보통 { background: var(--teal); color: #fff }
.open-btn { animation: wiggle 1.4s ease-in-out infinite }
@keyframes shake { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-10deg) scale(1.05) } 75% { transform: rotate(10deg) scale(1.05) } }
@keyframes reveal { from { transform: scale(.3); opacity: 0 } 70% { transform: scale(1.2) } }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg) } }
@keyframes wiggle { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-12deg) } 75% { transform: rotate(12deg) } }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg) } }
@keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0 } }
.toast { animation: pop .25s ease-out }
.ship { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
</style>
</head>
<body>

<!-- 로그인 -->
<section id="login" class="login wrap" hidden>
  <div style="width:100%;max-width:380px">
    <div class="logo"><span class="k">🏴‍☠️</span><h1>하이포스 트레저 헌터</h1><p>방학 보물 지도를 따라 떠나 볼까?</p></div>
    <form class="parch" id="loginForm" autocomplete="off">
      <div class="field"><label for="lg-code">우리 반 코드</label><input id="lg-code" maxlength="8" placeholder="예: K7P2Q" autocapitalize="characters" required></div>
      <div class="field"><label for="lg-nick">내 닉네임</label><input id="lg-nick" maxlength="12" placeholder="선생님이 알려 준 닉네임" required></div>
      <div class="field"><label>비밀번호 4자리</label></div>
      <div class="pin" id="lg-pin" aria-live="polite"></div>
      <div class="pad" id="lg-pad"></div>
      <p class="err" id="lg-err" role="alert"></p>
      <button class="btn" style="width:100%" id="lg-go">출항하기 ⛵</button>
    </form>
  </div>
</section>

<!-- 첫 로그인: 나만의 비밀번호 정하기 -->
<section id="setpin" class="login wrap" hidden>
  <div style="width:100%;max-width:380px">
    <div class="logo"><span class="k">🔐</span><h1>나만의 비밀번호</h1><p>선생님이 준 번호 대신 나만 아는 숫자 4개를 정해요</p></div>
    <div class="parch">
      <p id="sp-step" style="margin:0 0 4px;font-weight:700;text-align:center">새 비밀번호를 눌러 주세요</p>
      <div class="pin" id="sp-pin"></div>
      <div class="pad" id="sp-pad"></div>
      <p class="err" id="sp-err" role="alert"></p>
    </div>
  </div>
</section>

<!-- 게임 -->
<section id="game" hidden>
  <div class="hud"><div class="wrap">
    <button class="ava" id="hudAva" data-go="log" aria-label="내 캐릭터 바꾸기">🧭</button>
    <div class="who"><b id="hudNick"></b><small id="hudClass"></small></div>
    <span class="stat" title="지금 있는 섬">🏝️ <span class="num" id="hudLv">0</span></span>
    <span class="stat" title="항해 포인트">⛵ <span class="num" id="hudPt">0</span></span>
  </div></div>
  <main class="wrap" id="view"></main>
  <nav class="tabs"><div class="wrap" id="tabs"></div></nav>
</section>

<div class="toast" id="toast" hidden></div>
<div class="celebrate" id="celebrate"></div>
<div class="chest-modal" id="chestModal" hidden role="dialog" aria-modal="true" aria-labelledby="cm-title">
  <div class="chest-box">
    <div class="chest-ic" id="cm-ic">🎁</div>
    <h2 id="cm-title">보물상자를 여는 중…</h2>
    <p id="cm-sub"></p>
    <button class="btn" id="cm-close" hidden>좋아요!</button>
  </div>
</div>

<script src="/kid.js"></script>
</body>
</html>
