<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>트레저 헌터 선생님</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 선생님 콘솔: 상단 탭 + 한 열 작업 공간. 아이 화면의 바다·금화 색을 절제해서 사용 */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --sunk: #E9EDF2; --ink: #1B2533; --muted: #5C6778; --line: #D8DEE6;
  --accent: #0F5E7A; --accent-ink: #FFFFFF; --accent-soft: #DCEEF3; --gold: #A87300; --gold-bg: #F4B63F; --gold-soft: #FFF2D2;
  --eng: #137A6C; --eng-soft: #D8F1EC; --math: #C2462F; --math-soft: #FBE3DD; --gen: #6B5A3E; --gen-soft: #EFE8DC;
  --good: #1B7F4B; --danger: #C3392A; --danger-soft: #FBE1DD;
  --display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif; --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0E1620; --surface: #16212E; --sunk: #111A25; --ink: #E5ECF3; --muted: #9AA7B8; --line: #263445;
  --accent: #5BC0DE; --accent-ink: #062330; --accent-soft: #163847; --gold: #F4C35A; --gold-bg: #D9A23A; --gold-soft: #3A2F15;
  --eng: #4CD3BC; --eng-soft: #12322D; --math: #FF8B73; --math-soft: #3A1F1A; --gen: #CDB892; --gen-soft: #2E281D;
  --good: #57CC8D; --danger: #FF7D6E; --danger-soft: #3B1D1A; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body) }
button, input, select { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.25 }
h2 { font-size: 1.4rem } h3 { font-size: 1.1rem }
[hidden] { display: none !important }
.num { font-variant-numeric: tabular-nums }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px) }
.hwrap { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 10px }
.brand h1 { font-size: 1.35rem; color: var(--accent) } .brand small { color: var(--muted) }
nav { display: flex; gap: 4px; overflow-x: auto; margin-left: auto }
nav button { border: 0; background: none; border-radius: 999px; padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; position: relative }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent) }
nav .cnt { background: var(--danger); color: #fff; border-radius: 999px; font-size: .72rem; padding: 0 6px; margin-left: 4px }
main { max-width: 1120px; margin: 0 auto; padding-block: 20px 60px; display: grid; gap: 18px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center } .between { justify-content: space-between }
.muted { color: var(--muted) } .small { font-size: .85rem }
.cols { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr) } }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600 }
.btn:hover { border-color: var(--accent) } .btn:disabled { opacity: .45; cursor: not-allowed }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--danger); border-color: var(--danger) }
.btn.sm { padding: 4px 10px; font-size: .85rem } .btn.ghost { border-color: transparent; background: none; color: var(--muted) }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[type=text], input[type=password], input[type=number], select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; min-width: 0 }
input[type=number] { width: 90px }
label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600 }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 600; color: var(--muted); font-size: .9rem }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: .78rem; font-weight: 700; white-space: nowrap }
.t-영어 { background: var(--eng-soft); color: var(--eng) } .t-수학 { background: var(--math-soft); color: var(--math) } .t-공통 { background: var(--gen-soft); color: var(--gen) }
.tag.q { background: var(--accent-soft); color: var(--accent) } .tag.r { background: var(--gold-soft); color: var(--gold) }
.xp { color: var(--accent); font-weight: 700 } .coin { color: var(--gold); font-weight: 700 }
.tablewrap { overflow-x: auto } table { width: 100%; border-collapse: collapse }
th { text-align: left; font-size: .8rem; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr.click { cursor: pointer } tr.click:hover td { background: var(--sunk) } tr[aria-selected="true"] td { background: var(--accent-soft) }
.req { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px }
.req input { width: 20px; height: 20px }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.spick { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px }
.spick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.spick:disabled { opacity: .5; cursor: not-allowed }
.qpick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); cursor: pointer; width: 100% }
.qpick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--gold-soft); display: grid; gap: 6px }
.notice.d { background: var(--danger-soft) }
.pincard { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 18px; font-size: 1.05rem; justify-content: start }
.pincard b { font-family: var(--display); font-weight: 400; font-size: 1.4rem; letter-spacing: .08em }
.tierrow { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--sunk) }
.pill { padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap }
.pill.wait { background: var(--gold-soft); color: var(--gold) } .pill.ok { color: var(--good) } .pill.lock { color: var(--muted) }
.auth { max-width: 380px; margin: 10vh auto 0 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px) }
.err { color: var(--danger); font-weight: 600; margin: 0; min-height: 1.4em }
</style>
</head>
<body>
<section id="auth" class="gut" hidden>
  <form class="panel auth" id="authForm">
    <h2 id="authTitle">선생님 로그인</h2>
    <p class="muted small" id="authHelp"></p>
    <label class="f" id="codeWrap" hidden>설정 코드<input type="password" id="au-code" autocomplete="off"></label>
    <label class="f">아이디<input type="text" id="au-user" autocomplete="username" required></label>
    <label class="f">비밀번호<input type="password" id="au-pw" autocomplete="current-password" required></label>
    <p class="err" id="au-err" role="alert"></p>
    <button class="btn primary" id="au-go">로그인</button>
    <a class="small muted" href="/">아이 화면으로 가기</a>
  </form>
</section>

<section id="app" hidden>
  <header class="gut"><div class="hwrap">
    <div class="brand"><h1>트레저 헌터 선생님</h1><small id="seasonName"></small></div>
    <nav id="nav"></nav>
  </div></header>
  <main class="gut" id="view"></main>
</section>
<div class="toast" id="toast" hidden></div>

<script src="/teacher.js"></script>
</body>
</html>
